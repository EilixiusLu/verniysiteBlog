baseURL      = 'https://verniy.site/'
locale = 'zh-CN'
title        = 'VERNIY.SITE'
theme        = 'void'

# =============================================================================
# Avatar (displayed on homepage & about page)
# =============================================================================
[params]
  [params.avatar]
    url = '/avatar.webp'

# =============================================================================
# Social Links
# =============================================================================
  [params.social]
    github = 'https://github.com/EilixiusLu'
    email  = 'dec_verniy@outlook.com'

# =============================================================================
# Main Menu
# =============================================================================
[[menus.main]]
  name    = 'Main'
  pageRef = '/'
  weight  = 10

[[menus.main]]
  name    = 'Blogs'
  pageRef = '/posts'
  weight  = 20

[[menus.main]]
  name    = 'Tags'
  pageRef = '/tags'
  weight  = 30

[[menus.main]]
  name    = 'About'
  pageRef = '/about'
  weight  = 40

# =============================================================================
# Markup
# =============================================================================
[markup]
  [markup.tableOfContents]
    startLevel = 1
    endLevel   = 6
    ordered    = false

  [markup.goldmark.renderer]
    unsafe = true

# =============================================================================
# Build Stats (for Tailwind CSS v4 class detection)
# =============================================================================
[build.buildStats]
  disableClasses = false
  disableTags = false
  enable = true
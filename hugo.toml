baseURL      = 'https://verniy.site/'
languageCode = 'zh-CN'
title        = 'VERNIY.SITE'
theme        = 'pehtheme-hugo'

summaryLength = 20

# =============================================================================
# Site Parameters
# =============================================================================
[params]
  description  = '包罗万象，举一...然而没有千从'
  mainSections = 'posts'

  # Author Information
  [params.author]
    name   = 'Lo Chun Chai'
    bio    = 'Personal Blog'
    avatar = 'avatar.webp'

  # Social Links
  [params.social]
    github = 'https://github.com/EilixiusLu'
    email  = 'dec_verniy@outlook.com'

# =============================================================================
# Main Menu
# =============================================================================
[[menus.main]]
  name    = 'Home'
  pageRef = '/'
  weight  = 10

[[menus.main]]
  name    = 'Blogs'
  pageRef = '/posts'
  weight  = 20

[[menus.main]]
  name    = 'Tags'
  pageRef = '/tags'
  weight  = 30

[[menus.main]]
  name    = 'About'
  pageRef = '/about'
  weight  = 40

# =============================================================================
# Markup Settings
# =============================================================================
[markup]
  [markup.tableOfContents]
    startLevel = 1
    endLevel   = 6
    ordered    = false

  [markup.goldmark.renderer]
    unsafe = true